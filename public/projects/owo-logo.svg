<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" fill="none">
  <!-- Brand Background Accent (soft rounded pill) -->
  <rect width="400" height="160" rx="24" fill="#fdf6ee"/>
  <rect x="0.5" y="0.5" width="399" height="159" rx="23.5" stroke="#e8d9c5"/>

  <!-- Amber Circle / Pill Badge -->
  <g transform="translate(48, 30)">
    <!-- Outer amber circle -->
    <circle cx="50" cy="50" r="46" fill="#c17f3a"/>
    <!-- Subtle drop shadow glow -->
    <circle cx="50" cy="50" r="46" stroke="#a86a2c" stroke-width="1.5" opacity="0.4"/>
    <!-- Dashed ring -->
    <circle cx="50" cy="50" r="37" stroke="#fdf6ee" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.9"/>
    <!-- Nigerian Naira Symbol (₦) -->
    <text x="50" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">₦</text>
  </g>

  <!-- Typography: Wordmark + Tagline -->
  <g transform="translate(170, 42)">
    <!-- Lowercase "owo" wordmark -->
    <text x="0" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#2d1f0e" letter-spacing="0.05em">owo</text>
    <!-- Tagline: MONEY · SIMPLIFIED -->
    <text x="2" y="68" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9a7a58" letter-spacing="0.22em">MONEY · SIMPLIFIED</text>
  </g>
</svg>
